<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>site</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
        }
        
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/vb.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.84);
            z-index: 2;
        }
        
        .container {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .center-text {
            font-size: 72px;
            font-weight: 300;
            margin-bottom: 60px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }
        
        .center-text span {
            display: inline-block;
            position: relative;
        }
        
        .center-text span:nth-child(1) {
            animation: chaos1 1.5s steps(1) infinite;
        }
        
        .center-text span:nth-child(2) {
            animation: chaos2 1.7s steps(1) infinite;
        }
        
        .center-text span:nth-child(3) {
            animation: chaos3 1.6s steps(1) infinite;
        }
        
        .center-text span:nth-child(4) {
            animation: chaos4 1.8s steps(1) infinite;
        }
        
        @keyframes chaos1 {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            15% {
                transform: translate(-3px, 2px) rotate(-7deg) scale(0.96);
            }
            30% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            45% {
                transform: translate(2px, -2px) rotate(5deg) scale(1.03);
            }
            60% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            75% {
                transform: translate(-2px, 3px) rotate(-4deg) scale(0.98);
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
        }
        
        @keyframes chaos2 {
            0% {
                transform: translate(0, 0) rotate(0deg) skew(0deg);
                opacity: 1;
            }
            20% {
                transform: translate(2px, -1px) rotate(6deg) skew(-3deg);
                opacity: 0.85;
            }
            40% {
                transform: translate(0, 0) rotate(0deg) skew(0deg);
                opacity: 1;
            }
            60% {
                transform: translate(-3px, 2px) rotate(-5deg) skew(2deg);
                opacity: 0.9;
            }
            80% {
                transform: translate(0, 0) rotate(0deg) skew(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) rotate(0deg) skew(0deg);
                opacity: 1;
            }
        }
        
        @keyframes chaos3 {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                filter: blur(0px);
            }
            12% {
                transform: translate(-2px, -3px) rotate(-8deg) scale(1.04);
                filter: blur(0.5px);
            }
            25% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                filter: blur(0px);
            }
            37% {
                transform: translate(3px, 1px) rotate(9deg) scale(0.95);
                filter: blur(0px);
            }
            50% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                filter: blur(0px);
            }
            62% {
                transform: translate(-1px, 2px) rotate(-6deg) scale(1.02);
                filter: blur(0.3px);
            }
            75% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                filter: blur(0px);
            }
            87% {
                transform: translate(2px, -2px) rotate(4deg) scale(0.97);
                filter: blur(0px);
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                filter: blur(0px);
            }
        }
        
        @keyframes chaos4 {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            18% {
                transform: translate(3px, 2px) rotate(7deg) scale(1.05);
                opacity: 0.8;
            }
            35% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            52% {
                transform: translate(-2px, -1px) rotate(-6deg) scale(0.94);
                opacity: 0.9;
            }
            70% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            85% {
                transform: translate(1px, -3px) rotate(5deg) scale(1.03);
                opacity: 0.85;
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .links-container a {
            color: #5b9bd5;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        
        .links-container a:hover {
            color: #7bb5e8;
            text-decoration: underline;
            transform: translateX(5px);
        }
        
        @media (max-width: 768px) {
            .center-text {
                font-size: 48px;
            }
            
            .links-container a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="center-text">
            <span>c</span><span>1</span><span>2</span><span>e</span>
        </div>
        
        <div class="links-container">
            <a href="https://youtube.com/@c.12e">Youtube</a>
            <a href="https://c12e.newgrounds.com/">Newgrounds</a>
            <a href="https://c12e.bandcamp.com">Bandcamp</a>
            <a href="https://x.com/c12ead">X</a>
            <a href="commissions.html">Commissions</a>
        </div>
    </div>
</body>
</html>
